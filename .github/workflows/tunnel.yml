name: SSH Tunnel via serveo
on: push
jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install chisel and start SOCKS server
        run: |
          curl -L https://github.com/jpillora/chisel/releases/download/v1.10.1/chisel_1.10.1_linux_amd64.gz | gunzip > chisel
          chmod +x chisel
          ./chisel server --port 2222 --socks5 &
          sleep 3
      - name: Expose chisel server via serveo
        run: |
          # Use a custom subdomain for stability (change 'mytunnelxyz' to something unique)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R mytunnelxyz:80:localhost:2222 serveo.net